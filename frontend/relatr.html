<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>RelATR live</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: #0f1115; color: #e6e8ec;
               font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  .wrap { max-width: 2000px; margin: 24px auto; padding: 0 16px; }
  header.page-header { display: flex; align-items: baseline; gap: 16px; margin-bottom: 12px; }
  h1 { font-size: 18px; margin: 0; font-weight: 600; letter-spacing: 0.5px; }
  .meta-global { font-size: 12px; color: #8a92a5; }
  .controls { margin-left: auto; display: flex; gap: 10px; align-items: center;
              font-size: 12px; color: #8a92a5; flex-wrap: wrap; }
  select, input { background: #1a1e26; color: #e6e8ec; border: 1px solid #2a2f3a;
                  border-radius: 4px; padding: 3px 6px; font-size: 12px; }

  .chart-wrap { max-width: 1200px; margin: 0 auto 20px;
                border: 1px solid #1e232d; border-radius: 6px;
                background: #12161d; }
  .chart-wrap.hidden { display: none; }
  .chart-header { display: flex; align-items: baseline; gap: 12px;
                  padding: 10px 14px; border-bottom: 1px solid #1e232d; }
  .chart-header h2 { font-size: 14px; margin: 0; font-weight: 600; }
  .chart-header .info { font-size: 12px; color: #8a92a5; }
  .chart-header .close-btn { margin-left: auto; background: transparent;
                             color: #8a92a5; border: 1px solid #2a2f3a;
                             border-radius: 4px; padding: 2px 8px;
                             font-size: 12px; cursor: pointer; }
  .chart-header .close-btn:hover { color: #e6e8ec; border-color: #3a4150; }
  #chart { width: 100%; height: 360px; }

  .streams { max-width: 1200px; margin: 0 auto; }

  .stream { min-width: 0; }
  .stream + .stream { margin-top: 32px; }
  .stream-header { display: flex; align-items: baseline; gap: 10px;
                   padding: 6px 2px; margin-bottom: 6px; }
  .stream-header h2 { font-size: 14px; margin: 0; font-weight: 600;
                      letter-spacing: 0.4px; color: #e6e8ec; }
  .stream-header .meta { font-size: 11px; color: #8a92a5; }

  /* Telegram alarm controls (Uptrend Reversals header only) */
  .alarm-ctl { margin-left: auto; display: flex; gap: 8px; align-items: center;
               font-size: 12px; color: #8a92a5; }
  .alarm-ctl input { width: 44px; }
  .alarm-toggle { background: #1a1e26; color: #8a92a5; border: 1px solid #2a2f3a;
                  border-radius: 12px; padding: 3px 12px; font-size: 12px;
                  cursor: pointer; white-space: nowrap; }
  .alarm-toggle:hover { color: #e6e8ec; border-color: #3a4150; }
  .alarm-toggle.on { background: rgba(34, 229, 109, 0.12); color: #22e56d;
                     border-color: #22e56d; }
  .alarm-toggle:disabled { opacity: 0.5; cursor: not-allowed; }
  .alarm-test { background: transparent; color: #8a92a5; border: 1px solid #2a2f3a;
                border-radius: 4px; padding: 2px 8px; font-size: 12px; cursor: pointer; }
  .alarm-test:hover:not(:disabled) { color: #e6e8ec; border-color: #3a4150; }
  .alarm-test:disabled { opacity: 0.4; cursor: not-allowed; }
  .alarm-msg { font-size: 11px; }
  .alarm-msg.err { color: #ff4757; }
  .alarm-msg.ok  { color: #22e56d; }

  .filters { display: flex; gap: 8px; align-items: center; font-size: 12px;
             color: #8a92a5; padding: 8px 10px; margin-bottom: 12px;
             background: #12161d; border: 1px solid #1e232d; border-radius: 6px;
             flex-wrap: wrap; }
  .filters label { display: inline-flex; align-items: center; gap: 4px; }
  .filters input { width: 70px; }
  .filters select { width: auto; }
  .filters button { background: #1a1e26; color: #e6e8ec; border: 1px solid #2a2f3a;
                    border-radius: 4px; padding: 3px 10px; font-size: 12px; cursor: pointer; }
  .filters button:hover { background: #232833; }

  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 5px 8px; text-align: right; border-bottom: 1px solid #1e232d;
           font-size: 12px; }
  th { text-align: right; font-size: 10px; color: #8a92a5; font-weight: 500;
       text-transform: uppercase; letter-spacing: 0.5px; }
  th:first-child, td:first-child { text-align: left; }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { color: #e6e8ec; }
  th.sort-asc::after  { content: ' ▲'; color: #e6e8ec; }
  th.sort-desc::after { content: ' ▼'; color: #e6e8ec; }
  th.sector, td.sector { text-align: left; max-width: 180px;
                         white-space: nowrap; overflow: hidden;
                         text-overflow: ellipsis; color: #b6bccb; }
  tbody tr { cursor: pointer; }
  tbody tr:hover td { background: #17252b; }
  tbody tr.selected td { background: #1c2a34; }
  tr.updated td { background: rgba(80, 200, 120, 0.08); transition: background 0.9s; }
  td.pos { color: #22e56d; }
  td.neg { color: #ff4757; }
  a.tv-btn { color: #6aa7ff; text-decoration: none; font-size: 14px;
             padding: 0 4px; }
  a.tv-btn:hover { color: #b3d0ff; }
  .stale { color: #8a92a5; font-style: italic; }

  button.block-btn { background: transparent; border: 1px solid #2a2f3a;
                     color: #8a92a5; border-radius: 4px;
                     padding: 0 6px; font-size: 12px; line-height: 18px;
                     cursor: pointer; }
  button.block-btn:hover { color: #ff4757; border-color: #ff4757; }

  /* blocked list: a dropdown in the header controls */
  .blocked-panel { position: relative; font-size: 12px; color: #e6e8ec; }
  .blocked-panel.hidden { display: none; }
  .blocked-panel h3 { margin: 0; cursor: pointer; user-select: none;
                      font-size: 12px; font-weight: 400; color: #8a92a5;
                      background: #1a1e26; border: 1px solid #2a2f3a;
                      border-radius: 4px; padding: 3px 8px; }
  .blocked-panel h3:hover { color: #e6e8ec; background: #232833; }
  .blocked-panel h3 .caret { display: inline-block; width: 10px; }
  .blocked-panel ul { list-style: none; margin: 0; padding: 4px 10px;
                      position: absolute; right: 0; top: calc(100% + 4px);
                      width: 160px; max-height: 60vh; overflow-y: auto;
                      background: #12161d; border: 1px solid #2a2f3a;
                      border-radius: 6px; z-index: 20;
                      box-shadow: 0 6px 18px rgba(0,0,0,0.4); }
  .blocked-panel.collapsed ul { display: none; }
  .blocked-panel li { display: flex; align-items: center;
                      justify-content: space-between; gap: 6px;
                      padding: 4px 2px; border-bottom: 1px solid #1e232d;
                      cursor: pointer; }
  .blocked-panel li:last-child { border-bottom: none; }
  .blocked-panel li:hover { color: #22e56d; }
  .blocked-panel .unblock-hint { color: #8a92a5; font-size: 10px; }
  .blocked-panel li:hover .unblock-hint { color: #22e56d; }
</style>
</head>
<body>
<div class="wrap">
  <header class="page-header">
    <h1>Live Scanner</h1>
    <span class="meta-global" id="metaGlobal">loading&hellip;</span>
    <div class="controls">
      Rows:
      <input id="n" type="number" min="1" max="500" value="10" style="width: 60px">
      Refresh:
      <select id="interval">
        <option value="2000">2s</option>
        <option value="5000" selected>5s</option>
        <option value="10000">10s</option>
        <option value="30000">30s</option>
      </select>
      <div id="blockedPanel" class="blocked-panel hidden collapsed">
        <h3 id="blockedToggle" title="Show / hide blocked symbols"><span class="caret" id="blockedCaret">▸</span> Blocked (<span id="blockedCount">0</span>)</h3>
        <ul id="blockedList"></ul>
      </div>
    </div>
  </header>

  <div id="chartWrap" class="chart-wrap hidden">
    <div class="chart-header">
      <h2 id="chartSymbol">-</h2>
      <span class="info" id="chartInfo"></span>
      <button class="close-btn" id="chartClose" title="Close chart">Close</button>
    </div>
    <div id="chart"></div>
  </div>

  <div class="streams">
    <section class="stream" id="stream-relatr"></section>
    <section class="stream" id="stream-shorts"></section>
    <section class="stream" id="stream-rvol"></section>
  </div>
</div>


<script type="module">
  import { initChart } from '/ui/chart.js';

  // ---------- TradingView link ----------
  const TV_LAYOUT_ID = '4KgtaCO3';
  function tvUrl(row) {
    const sym = row.exchange
      ? `${row.exchange}:${row.symbol}`
      : row.symbol;
    return `https://www.tradingview.com/chart/${TV_LAYOUT_ID}/?symbol=${encodeURIComponent(sym)}`;
  }

  // ---------- formatters ----------
  function fmt(v, digits) {
    if (v === null || v === undefined) return '-';
    return Number(v).toFixed(digits);
  }
  function fmtInt(v) {
    if (v === null || v === undefined) return '-';
    return Number(v).toLocaleString();
  }
  function fmtTime(iso) {
    if (!iso) return '-';
    const d = new Date(iso);
    return d.toLocaleTimeString([], {
      hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false,
    });
  }
  function fmtNow(d) {
    return d.toLocaleTimeString([], {
      hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false,
    });
  }
  function esc(s) {
    if (s === null || s === undefined) return '';
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // ---------- blocked symbols (server-side, cleared at local midnight) ----------
  // Stored in the backend config so a blocked ticker is hidden in both
  // tables AND gets no Telegram alarm. The server only returns today's
  // entries, so the list empties itself at midnight.
  const LEGACY_BLOCKED_KEY = 'blocked.symbols';   // old per-browser storage
  const blockedEls = {
    panel: document.getElementById('blockedPanel'),
    list:  document.getElementById('blockedList'),
    count: document.getElementById('blockedCount'),
  };

  function todayLocal() {
    const d = new Date();
    // local date, not UTC
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  let BLOCKED = {};   // SYMBOL -> date, mirrored from CONFIG.blocked

  function syncBlockedFromConfig(conf) {
    const next = conf.blocked || {};
    const a = Object.keys(BLOCKED).sort().join(','), b = Object.keys(next).sort().join(',');
    BLOCKED = { ...next };
    if (a !== b) {
      renderBlockedPanel();
      for (const st of streams) st.rerender();
    }
  }

  function isBlocked(sym) { return sym in BLOCKED; }

  async function blockSymbol(sym) {
    BLOCKED[sym] = todayLocal();               // optimistic: hide right away
    renderBlockedPanel();
    for (const st of streams) st.rerender();
    try {
      setConfig(await readJson(await fetch(`/api/alarms/blocked/${encodeURIComponent(sym)}`, { method: 'POST' })));
    } catch (e) {
      metaGlobalEl.innerHTML = `<span class="stale">block ${esc(sym)} not saved: ${esc(e.message)}</span>`;
      await fetchConfig().catch(() => {});      // fall back to server truth
    }
  }
  async function unblockSymbol(sym) {
    delete BLOCKED[sym];
    renderBlockedPanel();
    for (const st of streams) st.rerender();
    try {
      setConfig(await readJson(await fetch(`/api/alarms/blocked/${encodeURIComponent(sym)}`, { method: 'DELETE' })));
    } catch (e) {
      metaGlobalEl.innerHTML = `<span class="stale">unblock ${esc(sym)} not saved: ${esc(e.message)}</span>`;
      await fetchConfig().catch(() => {});
    }
  }

  // One-time move of today's browser-only blocks to the server.
  async function migrateLegacyBlocked() {
    let legacy = {};
    try { legacy = JSON.parse(localStorage.getItem(LEGACY_BLOCKED_KEY)) || {}; } catch {}
    const today = todayLocal();
    for (const [sym, day] of Object.entries(legacy)) {
      if (day === today && !(sym in (CONFIG.blocked || {}))) {
        try {
          setConfig(await readJson(await fetch(`/api/alarms/blocked/${encodeURIComponent(sym)}`, { method: 'POST' })));
        } catch { return; }                     // keep legacy key; retry next load
      }
    }
    try { localStorage.removeItem(LEGACY_BLOCKED_KEY); } catch {}
  }

  function renderBlockedPanel() {
    const syms = Object.keys(BLOCKED).sort();
    blockedEls.count.textContent = syms.length;
    if (syms.length === 0) {
      blockedEls.panel.classList.add('hidden');
      blockedEls.list.replaceChildren();
      return;
    }
    blockedEls.panel.classList.remove('hidden');
    const frag = document.createDocumentFragment();
    for (const sym of syms) {
      const li = document.createElement('li');
      li.dataset.symbol = sym;
      li.title = 'Click to unblock';
      li.innerHTML = `<span>${sym}</span><span class="unblock-hint">unblock</span>`;
      frag.appendChild(li);
    }
    blockedEls.list.replaceChildren(frag);
  }
  // collapsed by default; click the header to expand / collapse
  const blockedToggleEl = document.getElementById('blockedToggle');
  const blockedCaretEl  = document.getElementById('blockedCaret');
  blockedToggleEl.addEventListener('click', () => {
    const collapsed = blockedEls.panel.classList.toggle('collapsed');
    blockedCaretEl.textContent = collapsed ? '▸' : '▾';
  });
  blockedEls.list.addEventListener('click', (e) => {
    const li = e.target.closest('li');
    if (!li || !li.dataset.symbol) return;
    unblockSymbol(li.dataset.symbol);
  });

  // ---------- filters ----------
  // type: number = min, maxNumber = max (null passes),
  //       maxNumberStrict = max (null fails), boolAbove = close > refField
  // NO default values here: every filter value comes from the backend
  // config (/api/alarms/config) and every edit is written back to it.
  // int: value is sent to the backend as a whole number.
  const FILTER_SPECS = {
    minRelatr:      { type: 'number',          field: 'relatr',     label: 'Min RelATR' },
    shortMinRelatr: { type: 'maxNumberStrict', field: 'relatr',     label: 'Max RelATR' },
    minRvol:        { type: 'number',          field: 'rvol',       label: 'Min RVOL' },
    maxChg:         { type: 'maxNumberStrict', field: 'chg_pct',    label: 'Chg% ≤' },
    minVolume:      { type: 'number',          field: 'volume',     label: 'Min Volume', int: true },
    minCumVolume:   { type: 'number',          field: 'cum_volume', label: 'Min CumVol', int: true },
    aboveSma200:    { type: 'boolAbove',       refField: 'sma200',  label: 'Above SMA200' },
  };

  // ---------- server config: the single source of truth ----------
  // Holds the Telegram switch, cooldown, and BOTH tables' filter values.
  // Loaded before the tables are built, re-read on every poll (so a
  // change made in another browser shows up here), written on every edit.
  let CONFIG = null;
  const configListeners = [];

  function setConfig(data) {
    CONFIG = data;
    for (const fn of configListeners) fn(CONFIG);
  }
  async function readJson(r) {
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.detail ? String(data.detail) : `HTTP ${r.status}`);
    return data;
  }
  async function fetchConfig() {
    setConfig(await readJson(await fetch('/api/alarms/config')));
  }
  async function postConfig(body) {
    setConfig(await readJson(await fetch('/api/alarms/config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    })));
  }
  async function resetConfig(scope) {
    setConfig(await readJson(await fetch(`/api/alarms/config/reset/${scope}`, { method: 'POST' })));
  }

  // Filter values used to live in localStorage -- drop the stale copies.
  for (const k of ['uptrend.filters', 'shorts.filters', 'shorts.filters.v2']) {
    try { localStorage.removeItem(k); } catch {}
  }

  // ---------- columns ----------
  // sortVal = value used for header sorting (nulls last); sortType 'str' sorts A-Z first
  const COLUMN_SPECS = {
    rank:   { header: '#',       cellHtml: (r, rank) => `<td>${rank}</td>` },
    symbol: { header: 'Symbol',  sortType: 'str', sortVal: (r) => r.symbol, cellHtml: (r) => `<td>${r.symbol}</td>` },
    sector: { header: 'Sector',  sortType: 'str', sortVal: (r) => r.sic_description, cellHtml: (r) => {
      const s = r.sic_description;
      if (!s) return `<td class="sector">—</td>`;
      const safe = esc(s);
      return `<td class="sector" title="${safe}">${safe}</td>`;
    }},
    time:   { header: 'Time',    sortVal: (r) => (r.ts ? Date.parse(r.ts) : null), cellHtml: (r) => `<td>${fmtTime(r.ts)}</td>` },
    close:  { header: 'Close',   sortVal: (r) => r.close, cellHtml: (r) => `<td>${fmt(r.close, 2)}</td>` },
    chg:    { header: 'Chg%',    sortVal: (r) => r.chg_pct, cellHtml: (r) => {
      const chg = r.chg_pct;
      const cls = chg == null ? '' : (chg > 0 ? 'pos' : (chg < 0 ? 'neg' : ''));
      return `<td class="${cls}">${chg == null ? '-' : chg.toFixed(2) + '%'}</td>`;
    }},
    vwap:   { header: 'VWAP',    sortVal: (r) => r.vwap, cellHtml: (r) => `<td>${fmt(r.vwap, 2)}</td>` },
    ema9:   { header: 'EMA9',    sortVal: (r) => r.ema9, cellHtml: (r) => `<td>${fmt(r.ema9, 2)}</td>` },
    rvol:   { header: 'RVOL',    sortVal: (r) => r.rvol, cellHtml: (r) => `<td>${fmt(r.rvol, 2)}</td>` },
    relatr: { header: 'RelATR',  sortVal: (r) => r.relatr, cellHtml: (r) => {
      const rel = r.relatr;
      // red = below VWAP, green = above
      const cls = rel > 0 ? 'neg' : (rel < 0 ? 'pos' : '');
      return `<td class="${cls}">${fmt(rel, 2)}</td>`;
    }},
    sma200: { header: 'SMA200',  sortVal: (r) => r.sma200, cellHtml: (r) => `<td>${fmt(r.sma200, 2)}</td>` },
    volume: { header: 'Volume',  sortVal: (r) => r.volume, cellHtml: (r) => `<td>${fmtInt(r.volume)}</td>` },
    cumvol: { header: 'CumVol',  sortVal: (r) => r.cum_volume, cellHtml: (r) => `<td>${fmtInt(r.cum_volume)}</td>` },
    tv:     { header: 'TV',      cellHtml: (r) => `<td><a class="tv-btn" href="${tvUrl(r)}" target="tradingview" onclick="event.stopPropagation()" title="Open in TradingView (reuses same tab)">↗</a></td>` },
    block:  { header: '',        cellHtml: (r) => `<td><button class="block-btn" data-block-sym="${r.symbol}" title="Hide ${r.symbol} until tomorrow">×</button></td>` },
  };
  const DEFAULT_COLUMNS = ['rank', 'symbol', 'time', 'close', 'chg',
                           'rvol', 'relatr', 'volume', 'cumvol', 'tv'];

  // ---------- streams ----------
  const STREAM_CONFIGS = [
    {
      id:             'uptrend',
      title:          'Uptrend Reversals',
      mountId:        'stream-relatr',
      // Only this stream drives Telegram alarms: its filter values ARE
      // the alarm thresholds, so alarm == what this table shows.
      alarm:          true,
      // UI filter key -> backend config field (top level of CONFIG)
      apiScope:       null,
      apiFields:      { minRelatr: 'min_relatr', minRvol: 'min_rvol', maxChg: 'max_chg_pct',
                        aboveSma200: 'above_sma200', minVolume: 'min_volume',
                        minCumVolume: 'min_cum_volume' },
      sortStorageKey: 'uptrend.sort.col',
      filterKeys:     ['minRelatr', 'minRvol', 'maxChg', 'aboveSma200', 'minVolume', 'minCumVolume'],
      columns:        ['rank', 'symbol', 'sector', 'time', 'close', 'chg',
                       'rvol', 'relatr', 'volume', 'cumvol', 'tv', 'block'],
    },
    {
      id:             'shorts',
      title:          'Reversal Shorts',
      mountId:        'stream-shorts',
      // UI filter key -> backend config field (under CONFIG.shorts)
      apiScope:       'shorts',
      apiFields:      { shortMinRelatr: 'max_relatr', minRvol: 'min_rvol',
                        minVolume: 'min_volume', minCumVolume: 'min_cum_volume' },
      sortStorageKey: 'shorts.sort.col',
      filterKeys:     ['shortMinRelatr', 'minRvol', 'minVolume', 'minCumVolume'],
      columns:        ['rank', 'symbol', 'sector', 'time', 'close', 'chg',
                       'rvol', 'relatr', 'volume', 'cumvol', 'tv', 'block'],
    },
    {
      id:             'elevated_rvol',
      title:          'Elevated RVOL',
      mountId:        'stream-rvol',
      // Display only -- no Telegram alarms (like Reversal Shorts).
      apiScope:       'elevated_rvol',
      apiFields:      { minRvol: 'min_rvol' },
      sortStorageKey: 'elevated_rvol.sort.col',
      defaultSort:    { key: 'rvol', dir: 'desc' },
      filterKeys:     ['minRvol'],
      columns:        ['rank', 'symbol', 'sector', 'time', 'close', 'chg',
                       'rvol', 'relatr', 'volume', 'cumvol', 'tv', 'block'],
    },
  ];

  // ---------- page controls ----------
  const metaGlobalEl = document.getElementById('metaGlobal');
  const nEl          = document.getElementById('n');
  const intervalEl   = document.getElementById('interval');

  // ---------- chart (shared by both tables) ----------
  const chartWrapEl    = document.getElementById('chartWrap');
  const chartCloseBtn  = document.getElementById('chartClose');
  const chartApi = initChart({
    containerEl: document.getElementById('chart'),
    titleEl:     document.getElementById('chartSymbol'),
    infoEl:      document.getElementById('chartInfo'),
  });
  let selectedSymbol = null;

  function selectSymbol(symbol) {
    selectedSymbol = symbol;
    const wasHidden = chartWrapEl.classList.contains('hidden');
    chartWrapEl.classList.remove('hidden');
    // chart was created while hidden (0px wide); make it re-measure
    if (wasHidden) window.dispatchEvent(new Event('resize'));
    chartApi.load(symbol);
    for (const s of streams) s.refreshSelectionHighlight();
  }

  function clearSelection() {
    selectedSymbol = null;
    chartWrapEl.classList.add('hidden');
    for (const s of streams) s.refreshSelectionHighlight();
  }

  chartCloseBtn.addEventListener('click', clearSelection);

  // ---------- stream: builds one table with its filters and sort ----------
  function createStream(cfg) {
    const mount = document.getElementById(cfg.mountId);

    // CONFIG -> { uiKey: value } for this stream's filters
    function filtersFromConfig(conf) {
      const src = cfg.apiScope ? conf[cfg.apiScope] : conf;
      return Object.fromEntries(cfg.filterKeys.map(k => [k, src[cfg.apiFields[k]]]));
    }
    // { uiKey: value } -> POST body for /api/alarms/config
    function filtersPayload(f) {
      const body = {};
      for (const k of cfg.filterKeys) {
        const spec = FILTER_SPECS[k];
        let v = f[k];
        if (spec.type === 'boolAbove') v = Boolean(v);
        else if (spec.int) v = Math.round(Number(v));
        else v = Number(v);
        body[cfg.apiFields[k]] = v;
      }
      return cfg.apiScope ? { [cfg.apiScope]: body } : body;
    }

    const activeColumns = cfg.columns || DEFAULT_COLUMNS;

    // sort = { key: column, dir: 'asc' | 'desc' }; default highest Chg% first
    const DEFAULT_SORT = cfg.defaultSort || { key: 'chg', dir: 'desc' };
    function loadSort() {
      try {
        const v = JSON.parse(localStorage.getItem(cfg.sortStorageKey));
        if (v && activeColumns.includes(v.key) && COLUMN_SPECS[v.key].sortVal
            && (v.dir === 'asc' || v.dir === 'desc')) return v;
      } catch {}
      return { ...DEFAULT_SORT };
    }
    function saveSort(v) {
      try { localStorage.setItem(cfg.sortStorageKey, JSON.stringify(v)); } catch {}
    }

    let FILTERS = filtersFromConfig(CONFIG);
    let SORT    = loadSort();

    const filterInputsHtml = cfg.filterKeys.map(k => {
      const spec = FILTER_SPECS[k];
      if (spec.type === 'boolAbove') {
        return `<label><input data-f="${k}" type="checkbox">${spec.label}</label>`;
      }
      // type=text avoids locale decimal commas; dash escaped for Chrome's v-flag pattern
      return `<label>${spec.label}    <input data-f="${k}" type="text" inputmode="decimal" pattern="[0-9.,\\-]*" size="6"></label>`;
    }).join('\n        ');
    const alarmCtlHtml = cfg.alarm ? `
        <div class="alarm-ctl">
          <span class="alarm-msg" data-alarm-msg></span>
          <label title="Minimum minutes between two alarms for the same symbol">Cooldown
            <input data-alarm-cooldown type="text" inputmode="numeric" pattern="[0-9]*" size="3"> min</label>
          <button class="alarm-test" data-alarm-test disabled
                  title="Send a test alarm with chart for the symbol open in the chart">Test</button>
          <button class="alarm-toggle" data-alarm-toggle
                  title="Send Telegram alarm + chart when a symbol passes these filters">Telegram: …</button>
        </div>` : '';
    const headerRightHtml = alarmCtlHtml || `
        <div class="alarm-ctl"><span class="alarm-msg" data-alarm-msg></span></div>`;
    mount.innerHTML = `
      <div class="stream-header">
        <h2>${cfg.title}</h2>
        ${headerRightHtml}
      </div>
      <div class="filters">
        ${filterInputsHtml}
        <button data-reset title="Restore default filter values (saved on the server)">Reset</button>
      </div>
      <table>
        <thead>
          <tr>
            ${activeColumns.map(k => {
              const sortable = COLUMN_SPECS[k].sortVal ? ' sortable' : '';
              return `<th class="${k}${sortable}" data-col="${k}">${COLUMN_SPECS[k].header}</th>`;
            }).join('')}
          </tr>
        </thead>
        <tbody data-body></tbody>
      </table>
    `;

    const bodyEl   = mount.querySelector('[data-body]');
    const headEl   = mount.querySelector('thead');
    const resetBtn = mount.querySelector('[data-reset]');
    const fEls = {};
    for (const key of cfg.filterKeys) {
      fEls[key] = mount.querySelector(`[data-f="${key}"]`);
    }

    const msgEl = mount.querySelector('[data-alarm-msg]');
    let msgTimer = null;
    function flash(text, kind = '') {
      msgEl.textContent = text;
      msgEl.className = `alarm-msg ${kind}`;
      if (msgTimer) clearTimeout(msgTimer);
      if (kind !== 'err') msgTimer = setTimeout(() => { msgEl.textContent = ''; }, 3000);
    }

    // Write FILTERS into the inputs. ``skipFocused`` leaves the field the
    // user is typing in alone when a background config refresh lands.
    function paintInputs(skipFocused) {
      for (const k of cfg.filterKeys) {
        const el = fEls[k];
        if (skipFocused && document.activeElement === el) continue;
        const spec = FILTER_SPECS[k];
        if (spec.type === 'boolAbove') el.checked = Boolean(FILTERS[k]);
        else                           el.value   = FILTERS[k];
      }
    }
    paintInputs(false);
    function paintSortIndicator() {
      for (const th of headEl.querySelectorAll('th[data-col]')) {
        const active = th.dataset.col === SORT.key;
        th.classList.toggle('sort-asc',  active && SORT.dir === 'asc');
        th.classList.toggle('sort-desc', active && SORT.dir === 'desc');
      }
    }
    paintSortIndicator();

    const lastTsBySymbol = new Map();

    function applySort(rows, sort) {
      const spec = COLUMN_SPECS[sort.key];
      if (!spec || !spec.sortVal) return rows;
      const sign = sort.dir === 'asc' ? 1 : -1;
      const isStr = spec.sortType === 'str';
      return rows.sort((a, b) => {
        const va = spec.sortVal(a), vb = spec.sortVal(b);
        const na = va === null || va === undefined || (!isStr && Number.isNaN(va));
        const nb = vb === null || vb === undefined || (!isStr && Number.isNaN(vb));
        if (na || nb) return na === nb ? 0 : (na ? 1 : -1);
        const c = isStr ? String(va).localeCompare(String(vb)) : va - vb;
        return c * sign;
      });
    }

    let lastData = null;

    function render(dataRows, now) {
      lastData = { dataRows, now };
      const n = Number(nEl.value) || 20;
      const f = FILTERS;
      dataRows = dataRows.filter(r => !isBlocked(r.symbol));
      let rows = dataRows.filter(r => {
        for (const k of cfg.filterKeys) {
          const spec = FILTER_SPECS[k];
          if (spec.type === 'boolAbove') {
            if (!f[k]) continue;
            const ref = r[spec.refField];
            if (ref === null || ref === undefined) return false;
            if (r.close === null || r.close === undefined) return false;
            if (r.close <= ref) return false;
            continue;
          }
          if (spec.type === 'maxNumber') {
            const v = r[spec.field];
            if (v === null || v === undefined) continue;
            if (v > f[k]) return false;
            continue;
          }
          if (spec.type === 'maxNumberStrict') {
            const v = r[spec.field];
            if (v === null || v === undefined) return false;
            if (v > f[k]) return false;
            continue;
          }
          const v = r[spec.field];
          if (v === null || v === undefined || v < f[k]) return false;
        }
        return true;
      });
      rows = applySort(rows, SORT);
      rows = rows.slice(0, n);

      const seen = new Set();
      const frag = document.createDocumentFragment();
      let rank = 0;
      for (const row of rows) {
        rank += 1;
        seen.add(row.symbol);
        const tr = document.createElement('tr');
        tr.dataset.symbol = row.symbol;
        const changed = lastTsBySymbol.get(row.symbol) !== row.ts;
        if (changed) tr.classList.add('updated');
        lastTsBySymbol.set(row.symbol, row.ts);

        if (row.symbol === selectedSymbol) tr.classList.add('selected');

        tr.innerHTML = activeColumns.map(k => COLUMN_SPECS[k].cellHtml(row, rank)).join('');
        frag.appendChild(tr);
      }
      bodyEl.replaceChildren(frag);
      for (const k of Array.from(lastTsBySymbol.keys())) {
        if (!seen.has(k)) lastTsBySymbol.delete(k);
      }
    }

    function renderError(msg) {
    }

    function refreshSelectionHighlight() {
      for (const row of bodyEl.querySelectorAll('tr')) {
        row.classList.toggle('selected', row.dataset.symbol === selectedSymbol);
      }
    }

    // Empty / half-typed ("-", "0.") / invalid input keeps the current
    // value instead of falling back to a default -- there are none.
    function readFiltersFromInputs() {
      const out = { ...FILTERS };
      for (const k of cfg.filterKeys) {
        const spec = FILTER_SPECS[k];
        if (spec.type === 'boolAbove') {
          out[k] = fEls[k].checked;
          continue;
        }
        const raw = String(fEls[k].value).trim().replace(',', '.');
        const n = raw === '' ? NaN : Number(raw);
        if (Number.isFinite(n)) out[k] = n;
      }
      return out;
    }

    // Debounced save: every edit is written to the server config.
    let saveTimer = null;
    function saveSoon() {
      if (saveTimer) clearTimeout(saveTimer);
      saveTimer = setTimeout(async () => {
        saveTimer = null;
        try {
          await postConfig(filtersPayload(FILTERS));
          flash('saved', 'ok');
        } catch (e) {
          flash(`not saved: ${e.message}`, 'err');
        }
      }, 500);
    }

    function onFilterChange() {
      FILTERS = readFiltersFromInputs();
      saveSoon();
      if (lastData) render(lastData.dataRows, lastData.now);
    }

    // Server config changed (our own save, a reset, or another browser).
    configListeners.push((conf) => {
      if (saveTimer) return;            // our unsaved edit wins until it is sent
      const next = filtersFromConfig(conf);
      const changed = cfg.filterKeys.some(k => next[k] !== FILTERS[k]);
      if (!changed) return;
      FILTERS = next;
      paintInputs(true);
      if (lastData) render(lastData.dataRows, lastData.now);
    });
    for (const el of Object.values(fEls)) {
      el.addEventListener('input', onFilterChange);
      el.addEventListener('change', onFilterChange);
    }
    resetBtn.addEventListener('click', async () => {
      if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
      try {
        await resetConfig(cfg.id);
        FILTERS = filtersFromConfig(CONFIG);
        paintInputs(false);
        if (lastData) render(lastData.dataRows, lastData.now);
        flash('defaults restored', 'ok');
      } catch (e) {
        flash(`reset failed: ${e.message}`, 'err');
      }
    });

    // header click: sort by column, click again to flip direction
    headEl.addEventListener('click', (e) => {
      const th = e.target.closest('th[data-col]');
      if (!th) return;
      const k = th.dataset.col;
      const spec = COLUMN_SPECS[k];
      if (!spec || !spec.sortVal) return;
      if (SORT.key === k) {
        SORT = { key: k, dir: SORT.dir === 'asc' ? 'desc' : 'asc' };
      } else {
        SORT = { key: k, dir: spec.sortType === 'str' ? 'asc' : 'desc' };
      }
      saveSort(SORT);
      paintSortIndicator();
      if (lastData) render(lastData.dataRows, lastData.now);
    });

    bodyEl.addEventListener('click', (e) => {
      const blockBtn = e.target.closest('[data-block-sym]');
      if (blockBtn) {
        e.stopPropagation();
        blockSymbol(blockBtn.dataset.blockSym);
        return;
      }
      const tr = e.target.closest('tr');
      if (!tr || !tr.dataset.symbol) return;
      selectSymbol(tr.dataset.symbol);
    });

    // ---------- Telegram alarm controls (alarm stream only) ----------
    const alarm = cfg.alarm ? createAlarmControls() : null;

    function createAlarmControls() {
      const toggleEl   = mount.querySelector('[data-alarm-toggle]');
      const testEl     = mount.querySelector('[data-alarm-test]');
      const cooldownEl = mount.querySelector('[data-alarm-cooldown]');
      let busy = false;

      function paint(conf) {
        const on = Boolean(conf.enabled);
        toggleEl.classList.toggle('on', on);
        toggleEl.textContent = on ? '🔔 Telegram: ON' : '🔕 Telegram: OFF';
        if (!conf.telegram_configured) {
          toggleEl.disabled = true;
          toggleEl.title = 'TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID missing in 32_smsystem.env';
        } else if (!busy) {
          toggleEl.disabled = false;
        }
        if (document.activeElement !== cooldownEl) cooldownEl.value = conf.cooldown_minutes;
        refreshTestButton();
      }
      configListeners.push(paint);

      toggleEl.addEventListener('click', async () => {
        const next = !CONFIG.enabled;
        busy = true;
        toggleEl.disabled = true;
        try {
          await postConfig({ enabled: next });
          flash(next ? 'alarms ON' : 'alarms OFF', 'ok');
        } catch (e) {
          flash(e.message, 'err');
        } finally {
          busy = false;
          paint(CONFIG);
        }
      });

      cooldownEl.addEventListener('change', async () => {
        const v = Math.round(Number(String(cooldownEl.value).trim()));
        if (!Number.isFinite(v) || v < 1) { paint(CONFIG); return; }
        try { await postConfig({ cooldown_minutes: v }); flash('cooldown saved', 'ok'); }
        catch (e) { flash(e.message, 'err'); paint(CONFIG); }
      });

      function refreshTestButton() {
        const ok = Boolean(selectedSymbol) && Boolean(CONFIG && CONFIG.telegram_configured);
        testEl.disabled = !ok;
        testEl.textContent = selectedSymbol ? `Test ${selectedSymbol}` : 'Test';
      }

      testEl.addEventListener('click', async () => {
        if (!selectedSymbol) return;
        const sym = selectedSymbol;
        testEl.disabled = true;
        flash(`sending ${sym}…`);
        try {
          const data = await readJson(await fetch(`/api/alarms/test/${encodeURIComponent(sym)}`, { method: 'POST' }));
          flash(data.chart ? `${sym} sent with chart` : `${sym} sent (text only, chart failed)`,
                data.chart ? 'ok' : 'err');
        } catch (e) {
          flash(`test failed: ${e.message}`, 'err');
        } finally {
          refreshTestButton();
        }
      });

      paint(CONFIG);
      return { refreshTestButton };
    }

    function refreshSelectionHighlightAndAlarm() {
      refreshSelectionHighlight();
      if (alarm) alarm.refreshTestButton();
    }

    function rerender() { if (lastData) render(lastData.dataRows, lastData.now); }

    return { render, renderError, rerender, refreshSelectionHighlight: refreshSelectionHighlightAndAlarm };
  }

  // ---------- polling: one fetch per tick, shared by both streams ----------
  let pollTimer = null;
  let inFlight  = false;

  async function tickAll() {
    if (inFlight) return;
    inFlight = true;
    try {
      const [r] = await Promise.all([
        fetch(`/api/livestream/top`),
        // keep filters/switch in sync with the server (other browsers too)
        fetchConfig().catch(() => {}),
      ]);
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const data = await r.json();
      const now = new Date();
      metaGlobalEl.textContent =
        `${data.rows.length} symbols received  |  last fetch ${fmtNow(now)}`;
      for (const s of streams) s.render(data.rows, now);
    } catch (e) {
      metaGlobalEl.innerHTML = `<span class="stale">error: ${e.message}</span>`;
      for (const s of streams) s.renderError(e.message);
    } finally {
      inFlight = false;
    }
  }

  function reschedule() {
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(tickAll, Number(intervalEl.value));
  }
  nEl.addEventListener('change', tickAll);
  intervalEl.addEventListener('change', reschedule);

  // ---------- boot ----------
  // Tables are built only after the server config arrives -- the page
  // has no filter values of its own to fall back on.
  let streams = [];
  async function boot() {
    for (;;) {
      try { await fetchConfig(); break; }
      catch (e) {
        metaGlobalEl.innerHTML = `<span class="stale">config not loaded: ${esc(e.message)} -- retrying…</span>`;
        await new Promise(res => setTimeout(res, 3000));
      }
    }
    configListeners.push(syncBlockedFromConfig);
    syncBlockedFromConfig(CONFIG);
    await migrateLegacyBlocked();
    streams = STREAM_CONFIGS.map(createStream);
    renderBlockedPanel();
    tickAll();
    reschedule();
  }
  boot();
</script>
</body>
</html>
