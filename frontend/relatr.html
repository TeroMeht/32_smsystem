<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>RelATR live</title>
<!--
  Live RelATR dashboard.

  Two concerns on one page, top to bottom:
    1. Chart (top)  -- rendered by /ui/chart.js. On a table-row click,
                       the current session's candles for that symbol are
                       fetched from /api/livestream/bars/{symbol}.
    2. Table (below) -- polls /api/livestream/top on a user-chosen
                        interval and shows the current top-N symbols by
                        RelATR.

  Chart logic lives in a separate ES module so this page stays about
  layout + table plumbing, and chart internals (candle setup, cache,
  render pipeline) can evolve without touching this file.
-->
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: #0f1115; color: #e6e8ec;
               font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  .wrap { max-width: 1200px; margin: 24px auto; padding: 0 16px; }
  header { display: flex; align-items: baseline; gap: 16px; margin-bottom: 12px; }
  h1 { font-size: 18px; margin: 0; font-weight: 600; letter-spacing: 0.5px; }
  .meta { font-size: 12px; color: #8a92a5; }
  .controls { margin-left: auto; display: flex; gap: 10px; align-items: center;
              font-size: 12px; color: #8a92a5; flex-wrap: wrap; }
  select, input { background: #1a1e26; color: #e6e8ec; border: 1px solid #2a2f3a;
                  border-radius: 4px; padding: 3px 6px; font-size: 12px; }
  .filters { display: flex; gap: 10px; align-items: center; font-size: 12px;
             color: #8a92a5; padding: 8px 12px; margin-bottom: 12px;
             background: #12161d; border: 1px solid #1e232d; border-radius: 6px;
             flex-wrap: wrap; }
  .filters label { display: inline-flex; align-items: center; gap: 4px; }
  .filters input { width: 80px; }
  .filters button { background: #1a1e26; color: #e6e8ec; border: 1px solid #2a2f3a;
                    border-radius: 4px; padding: 3px 10px; font-size: 12px; cursor: pointer; }
  .filters button:hover { background: #232833; }

  .chart-wrap { margin-bottom: 22px; border: 1px solid #1e232d; border-radius: 6px;
                background: #12161d; }
  .chart-header { display: flex; align-items: baseline; gap: 12px;
                  padding: 10px 14px; border-bottom: 1px solid #1e232d; }
  .chart-header h2 { font-size: 14px; margin: 0; }
  .chart-header .info { font-size: 12px; color: #8a92a5; }
  #chart { width: 100%; height: 360px; }

  /* Grid of mini-charts: one cell per filtered symbol, 3 per row. */
  .chart-grid { display: grid; grid-template-columns: repeat(3, 1fr);
                gap: 12px; margin-top: 20px; }
  .grid-cell { border: 1px solid #1e232d; border-radius: 6px;
               background: #12161d; overflow: hidden; }
  .grid-cell .cell-header { display: flex; justify-content: space-between;
                            align-items: baseline; padding: 6px 10px;
                            border-bottom: 1px solid #1e232d;
                            font-size: 12px; }
  .grid-cell .cell-symbol { color: #e6e8ec; font-weight: 600; }
  .grid-cell .cell-info { color: #8a92a5; font-size: 11px; }
  .grid-cell .cell-body { width: 100%; height: 180px; }

  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 6px 10px; text-align: right; border-bottom: 1px solid #1e232d; }
  th { text-align: right; font-size: 11px; color: #8a92a5; font-weight: 500;
       text-transform: uppercase; letter-spacing: 0.6px; }
  th:first-child, td:first-child { text-align: left; }
  tbody tr { cursor: pointer; }
  tbody tr:hover td { background: #17252b; }
  tbody tr.selected td { background: #1c2a34; }
  tr.updated td { background: rgba(80, 200, 120, 0.08); transition: background 0.9s; }
  /* Bright palette shared with the chart candles / VWAP line. */
  /* Bright palette shared with the chart candles / VWAP line. */
  td.pos { color: #22e56d; }
  td.neg { color: #ff4757; }
  /* "Send to TradingView" launcher in each row. */
  a.tv-btn { color: #6aa7ff; text-decoration: none; font-size: 14px;
             padding: 0 4px; }
  a.tv-btn:hover { color: #b3d0ff; }
  .stale { color: #8a92a5; font-style: italic; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Live RelATR</h1>
    <span class="meta" id="meta">loading&hellip;</span>
    <div class="controls">
      Sort:
      <select id="order">
        <option value="desc">RelATR desc (below VWAP)</option>
        <option value="abs">|RelATR| magnitude</option>
      </select>
      Rows:
      <input id="n" type="number" min="1" max="500" value="20" style="width: 60px">
      Refresh:
      <select id="interval">
        <option value="2000">2s</option>
        <option value="5000" selected>5s</option>
        <option value="10000">10s</option>
        <option value="30000">30s</option>
      </select>
    </div>
  </header>

  <!-- Live-editable filter thresholds. Values persist to localStorage so
       reloading the page keeps whatever the user last set. -->
  <div class="filters">
    <label>Min RelATR    <input id="fMinRelatr"    type="number" step="0.01"></label>
    <label>Min RVOL      <input id="fMinRvol"      type="number" step="0.1"></label>
    <label>Min Volume    <input id="fMinVolume"    type="number" step="1"></label>
    <label>Min CumVol    <input id="fMinCumVolume" type="number" step="1000"></label>
    <button id="fReset" title="Restore defaults">Reset</button>
  </div>

  <!-- Chart -- populated on row click by chart.js -->
  <div class="chart-wrap">
    <div class="chart-header">
      <h2 id="chartSymbol">Click a row below to load today's session</h2>
      <span class="info" id="chartInfo"></span>
    </div>
    <div id="chart"></div>
  </div>

  <!-- Mini-chart grid: one cell per filter-matched symbol, 3 per row.
       Reconciled and refreshed on the same interval as the table. -->
  <div id="chartGrid" class="chart-grid"></div>

  <table id="tbl">
    <thead>
      <tr>
        <th>#</th>
        <th>Symbol</th>
        <th>Time</th>
        <th>Close</th>
        <th>Chg%</th>
        <th>VWAP</th>
        <th>EMA9</th>
        <th>RVOL</th>
        <th>RelATR</th>
        <th>Volume</th>
        <th>CumVol</th>
        <th>TV</th>
      </tr>
    </thead>
    <tbody id="body"></tbody>
  </table>
</div>

<script type="module">
  import { initChart } from '/ui/chart.js';

  // ---------- client-side filters (live-editable in the UI) --------------
  // Backend returns the LATEST bar per symbol, unfiltered. All thresholds
  // are set from the input fields above; their values persist in
  // localStorage so a reload keeps whatever the user last set.
  const FILTER_DEFAULTS = {
    minRelatr:    0.45,
    minRvol:      2.0,
    minVolume:    100,
    minCumVolume: 100000,
  };
  const FILTER_STORAGE_KEY = 'relatr.filters';

  const fEls = {
    minRelatr:    document.getElementById('fMinRelatr'),
    minRvol:      document.getElementById('fMinRvol'),
    minVolume:    document.getElementById('fMinVolume'),
    minCumVolume: document.getElementById('fMinCumVolume'),
  };

  function loadFilters() {
    let saved = {};
    try { saved = JSON.parse(localStorage.getItem(FILTER_STORAGE_KEY)) || {}; }
    catch { saved = {}; }
    const merged = { ...FILTER_DEFAULTS, ...saved };
    for (const [k, v] of Object.entries(merged)) fEls[k].value = v;
    return merged;
  }
  function readFilters() {
    const out = {};
    for (const [k, defVal] of Object.entries(FILTER_DEFAULTS)) {
      const raw = fEls[k].value;
      const n = raw === '' ? defVal : Number(raw);
      out[k] = Number.isFinite(n) ? n : defVal;
    }
    return out;
  }
  function saveFilters(f) {
    try { localStorage.setItem(FILTER_STORAGE_KEY, JSON.stringify(f)); }
    catch {}
  }

  let FILTERS = loadFilters();

  // ---------- TradingView deep-link ---------------------------------------
  // Every table row gets a small ↗ button that opens the symbol in your
  // saved TradingView layout (new tab). Layout id lives here so the button
  // stays alive even when the exchange column is empty -- we fall back to
  // a bare symbol, which TradingView usually resolves for US mid/large caps.
  const TV_LAYOUT_ID = '4KgtaCO3';
  function tvUrl(row) {
    const sym = row.exchange
      ? `${row.exchange}:${row.symbol}`
      : row.symbol;
    return `https://www.tradingview.com/chart/${TV_LAYOUT_ID}/?symbol=${encodeURIComponent(sym)}`;
  }

  // ---------- chart -------------------------------------------------------
  const chartApi = initChart({
    containerEl: document.getElementById('chart'),
    titleEl:     document.getElementById('chartSymbol'),
    infoEl:      document.getElementById('chartInfo'),
  });

  // ---------- mini-chart grid --------------------------------------------
  // One chart per filter-matched symbol, 3 per row, reconciled + refreshed
  // on each poll tick. Each grid chart shares chart.js with the top chart,
  // but with a smaller height and shorter cache (fresh data every tick).
  const chartGridEl = document.getElementById('chartGrid');
  const gridCharts = new Map();  // symbol -> { chart, cell }

  function mountGridCell(symbol) {
    const cell = document.createElement('div');
    cell.className = 'grid-cell';
    cell.dataset.symbol = symbol;
    cell.innerHTML = `
      <div class="cell-header">
        <span class="cell-symbol">${symbol}</span>
        <span class="cell-info"></span>
      </div>
      <div class="cell-body"></div>
    `;
    chartGridEl.appendChild(cell);
    const chart = initChart({
      containerEl: cell.querySelector('.cell-body'),
      titleEl:     cell.querySelector('.cell-symbol'),
      infoEl:      cell.querySelector('.cell-info'),
      height:      180,
      cacheTtlMs:  3000,   // short cache so grid updates feel live
    });
    gridCharts.set(symbol, { chart, cell });
  }

  function unmountGridCell(symbol) {
    const entry = gridCharts.get(symbol);
    if (!entry) return;
    entry.chart.dispose();
    entry.cell.remove();
    gridCharts.delete(symbol);
  }

  function reconcileGrid(orderedSymbols) {
    const wanted = new Set(orderedSymbols);
    // Drop cells whose symbol no longer matches the filter.
    for (const sym of Array.from(gridCharts.keys())) {
      if (!wanted.has(sym)) unmountGridCell(sym);
    }
    // Add + reorder to match the table's ranking.
    let prev = null;
    for (const sym of orderedSymbols) {
      if (!gridCharts.has(sym)) mountGridCell(sym);
      const { cell } = gridCharts.get(sym);
      if (prev === null) chartGridEl.prepend(cell);
      else prev.after(cell);
      prev = cell;
    }
    // Refresh every cell's bars. chart.load(symbol) hits /api/livestream/bars/{sym};
    // the short cache means each tick actually fetches, so new 2-min bars land as
    // soon as they're written to the livestream table.
    for (const [sym, { chart }] of gridCharts) {
      chart.load(sym);
    }
  }

  // ---------- table polling ----------------------------------------------
  const bodyEl = document.getElementById('body');
  const metaEl = document.getElementById('meta');
  const orderEl = document.getElementById('order');
  const nEl = document.getElementById('n');
  const intervalEl = document.getElementById('interval');
  const lastTsBySymbol = new Map();  // symbol -> ts, to flash updated rows
  let selectedSymbol = null;         // for cross-poll row highlight
  let pollTimer = null;

  function fmt(v, digits) {
    if (v === null || v === undefined) return '-';
    return Number(v).toFixed(digits);
  }
  function fmtInt(v) {
    if (v === null || v === undefined) return '-';
    return Number(v).toLocaleString();
  }
  function fmtTime(iso) {
    if (!iso) return '-';
    const d = new Date(iso);
    // 24-hour format everywhere in this app (matches backend/log convention).
    return d.toLocaleTimeString([], {
      hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false,
    });
  }
  function fmtNow(d) {
    return d.toLocaleTimeString([], {
      hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false,
    });
  }

  async function tick() {
    const n = Number(nEl.value) || 20;
    const order = orderEl.value;
    try {
      const r = await fetch(`/api/livestream/top`);
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const data = await r.json();
      const now = new Date();

      // All display filters live here. Backend returns the latest bar
      // per symbol, unfiltered; we apply thresholds, sort, and limit.
      const f = FILTERS;
      let rows = data.rows.filter(r =>
        r.relatr     !== null && r.relatr     >= f.minRelatr    &&
        r.rvol_cum   !== null && r.rvol_cum   >= f.minRvol      &&
        r.volume     !== null && r.volume     >= f.minVolume    &&
        r.cum_volume !== null && r.cum_volume >= f.minCumVolume
      );
      if (order === 'abs') {
        rows.sort((a, b) => Math.abs(b.relatr) - Math.abs(a.relatr));
      } else {
        rows.sort((a, b) => b.relatr - a.relatr);
      }
      rows = rows.slice(0, n);

      metaEl.textContent =
        `${rows.length} rows (relatr>=${f.minRelatr}, rvol>=${f.minRvol}, ` +
        `vol>=${f.minVolume}, cumvol>=${f.minCumVolume}, ` +
        `${data.rows.length} received)  |  last update ${fmtNow(now)}`;

      const seen = new Set();
      const frag = document.createDocumentFragment();
      let rank = 0;
      for (const row of rows) {
        rank += 1;
        seen.add(row.symbol);
        const tr = document.createElement('tr');
        tr.dataset.symbol = row.symbol;
        const changed = lastTsBySymbol.get(row.symbol) !== row.ts;
        if (changed) tr.classList.add('updated');
        lastTsBySymbol.set(row.symbol, row.ts);

        // Color convention: RED for positive RelATR (price extended below
        // VWAP), GREEN for negative (price above VWAP).
        const rel = row.relatr;
        const relClass = rel > 0 ? 'neg' : (rel < 0 ? 'pos' : '');
        if (row.symbol === selectedSymbol) tr.classList.add('selected');

        const chg = row.chg_pct;
        const chgClass = chg == null ? '' : (chg > 0 ? 'pos' : (chg < 0 ? 'neg' : ''));

        tr.innerHTML = `
          <td>${rank}</td>
          <td>${row.symbol}</td>
          <td>${fmtTime(row.ts)}</td>
          <td>${fmt(row.close, 2)}</td>
          <td class="${chgClass}">${chg == null ? '-' : chg.toFixed(2) + '%'}</td>
          <td>${fmt(row.vwap, 2)}</td>
          <td>${fmt(row.ema9, 2)}</td>
          <td>${fmt(row.rvol_cum, 2)}</td>
          <td class="${relClass}">${fmt(row.relatr, 2)}</td>
          <td>${fmtInt(row.volume)}</td>
          <td>${fmtInt(row.cum_volume)}</td>
          <td><a class="tv-btn" href="${tvUrl(row)}" target="tradingview"
                 onclick="event.stopPropagation()" title="Open in TradingView (reuses same tab)">↗</a></td>
        `;
        frag.appendChild(tr);
      }
      bodyEl.replaceChildren(frag);
      for (const k of Array.from(lastTsBySymbol.keys())) {
        if (!seen.has(k)) lastTsBySymbol.delete(k);
      }

      // Mini-chart grid: sync cells to the same filtered/ordered set as
      // the table, then refresh each cell's bars. Runs on every tick, so
      // when the poll interval is 5s and BAR_MINUTES=2, every grid chart
      // picks up new candles within ~5s of them being written.
      reconcileGrid(rows.map(r => r.symbol));
    } catch (e) {
      metaEl.innerHTML = `<span class="stale">error: ${e.message}</span>`;
    }
  }

  function reschedule() {
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(tick, Number(intervalEl.value));
  }
  orderEl.addEventListener('change', tick);
  nEl.addEventListener('change', tick);
  intervalEl.addEventListener('change', reschedule);

  // Filter inputs: re-read + persist + refresh on every edit.
  function onFilterChange() {
    FILTERS = readFilters();
    saveFilters(FILTERS);
    tick();
  }
  for (const el of Object.values(fEls)) {
    el.addEventListener('input', onFilterChange);
    el.addEventListener('change', onFilterChange);
  }
  document.getElementById('fReset').addEventListener('click', () => {
    for (const [k, v] of Object.entries(FILTER_DEFAULTS)) fEls[k].value = v;
    onFilterChange();
  });

  // Row click -> chart. Delegated so it survives table re-renders.
  bodyEl.addEventListener('click', (e) => {
    const tr = e.target.closest('tr');
    if (!tr || !tr.dataset.symbol) return;
    selectedSymbol = tr.dataset.symbol;
    chartApi.load(selectedSymbol);
    // Update highlight immediately, don't wait for the next poll.
    for (const row of bodyEl.querySelectorAll('tr')) {
      row.classList.toggle('selected', row.dataset.symbol === selectedSymbol);
    }
  });

  // ---------- boot -------------------------------------------------------
  tick();
  reschedule();
</script>
</body>
</html>
