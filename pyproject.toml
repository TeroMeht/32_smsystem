authors = [
    { name = "TeroMeht", email = "mehtanen.tero@outlook.com" }
]



requires-python = ">=3.12"
dependencies = [
    "aeventkit==2.1.0",
    "aiohappyeyeballs==2.7.1",
    "aiohttp==3.14.3",
    "aiosignal==1.4.0",
    "annotated-doc==0.0.5",
    "annotated-types==0.8.0",
    "anyio==4.15.0",
    "asyncpg==0.31.0",
    "attrs==26.1.0",
    "certifi==2026.7.22",
    "charset-normalizer==3.5.1",
    "click==8.5.0",
    "colorama==0.4.6",
    "data-sources",
    "fastapi==0.141.1",
    "frozenlist==1.8.0",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "ib-async==2.1.0",
    "idna==3.19",
    "indicators",
    "iniconfig==2.3.0",
    "multidict==6.7.1",
    "nest-asyncio==1.6.0",
    "numpy==2.5.2",
    "packaging==26.3",
    "pandas==3.0.5",
    "pluggy==1.6.0",
    "propcache==0.5.2",
    "psycopg2-binary==2.9.12",
    "pydantic==2.13.5",
    "pydantic-core==2.46.5",
    "pydantic-settings==2.15.0",
    "pygments==2.21.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "python-dateutil==2.9.0.post0",
    "python-dotenv==1.2.3",
    "requests==2.34.2",
    "six==1.17.0",
    "starlette==1.6.0",
    "typing-extensions==4.16.0",
    "typing-inspection==0.4.4",
    "tzdata==2025.3",
    "urllib3==2.7.0",
    "uvicorn==0.52.4",
    "websockets==17.1",
    "yarl==1.24.5",
]

[tool.uv]
package = false

[project.scripts]
smsystem = "smsystem:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
data-sources = { path = "../data_sources", editable = true }
indicators   = { path = "../indicators",   editable = true }
